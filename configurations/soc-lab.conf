
input {
  syslog {
    id => "kali-rsyslog"
    host => "192.168.56.103"
    port => 5514
    tags => ["linux-rsyslog"]
  }

  beats {
    id => "windows-winlogbeat"
    host => "192.168.56.103"
    port => 5044
  }
}

filter {
  if "linux-rsyslog" in [tags] {
    mutate {
      add_field => {
        "lab_source" => "kali"
      }
    }
  } else if [@metadata][beat] == "winlogbeat" {
    mutate {
      add_field => {
        "lab_source" => "windows10"
      }
    }
  }
}

output {
  if "linux-rsyslog" in [tags] {
    elasticsearch {
      hosts => ["https://192.168.56.103:9200"]
      user => "${ES_USERNAME}"
      password => "${ES_PASSWORD}"
      ssl_enabled => true
      ssl_certificate_authorities => ["/etc/logstash/certs/http_ca.crt"]
      index => "kali-syslog-%{+YYYY.MM.dd}"
    }
  } else if [@metadata][beat] == "winlogbeat" {
    elasticsearch {
      hosts => ["https://192.168.56.103:9200"]
      user => "${ES_USERNAME}"
      password => "${ES_PASSWORD}"
      ssl_enabled => true
      ssl_certificate_authorities => ["/etc/logstash/certs/http_ca.crt"]
      index => "winlogbeat-%{+YYYY.MM.dd}"
    }
  }
}
